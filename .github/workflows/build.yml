name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install THEOS and deps
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          # FINALPACKAGE=1：Theos 用 -Os 优化并 strip 调试符号，体积小
          make FINALPACKAGE=1
          mkdir -p out
          # 只取 release 产物，并强制 thin arm64（TrollFools 内置 ldid 不认 fat，
          # 对 arm64+arm64e 双架构报 "Unsupported Mach-O type"）
          find .theos -path '*release*' -name '*.dylib' | while read f; do
            lipo -thin arm64 "$f" -output "out/$(basename "$f")"
          done
          ls -la out/
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: out/*.dylib
          if-no-files-found: error
