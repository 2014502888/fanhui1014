name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install THEOS and deps
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          # FINALPACKAGE=1：Theos 用 -Os 优化并 strip 调试符号，体积小
          make FINALPACKAGE=1
          mkdir -p out
          # Makefile ARCHS=arm64 直接产出 thin dylib，直接拷贝即可（lipo 对 thin 输入反而报错）
          find .theos -name '*.dylib' -exec cp {} out/ \;
          ls -la out/
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullScreenBackTweak-dylib
          path: out/*.dylib
          if-no-files-found: error
